<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Finder Malawi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f5f1;--surface:#fff;--text:#1b211d;--muted:#5d675f;--line:#dde1d8;--ok:#177a43;--okbg:#e0f2e7;--low:#966100;--lowbg:#fbefcf;--out:#b3261e;--outbg:#fbe1de;--accent:#1b211d;--accenttext:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181500;--bg:#141815;--surface:#1d231f;--text:#eef1ec;--muted:#a3ada5;--line:#303832;--ok:#5fd18d;--okbg:#17301f;--low:#f0bd57;--lowbg:#352a10;--out:#ff8a80;--outbg:#3a1c1a;--accent:#eef1ec;--accenttext:#141815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141815;--surface:#1d231f;--text:#eef1ec;--muted:#a3ada5;--line:#303832;--ok:#5fd18d;--okbg:#17301f;--low:#f0bd57;--lowbg:#352a10;--out:#ff8a80;--outbg:#3a1c1a;--accent:#eef1ec;--accenttext:#141815;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,Segoe UI,Arial,sans-serif;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.02;margin:12px 0 8px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;max-width:46ch}
.flag{display:flex;height:6px;border-radius:3px;overflow:hidden;width:96px}
.flag i{flex:1}.flag i:nth-child(1){background:#111}.flag i:nth-child(2){background:#ce1126}.flag i:nth-child(3){background:#339e35}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:.85rem;color:var(--muted);width:100%;margin-bottom:-2px}
select,input[type=search]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.chip{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accenttext);border-color:var(--accent)}
:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.count{margin:18px 2px 10px;color:var(--muted);font-size:.95rem}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;text-align:left;width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:14px 16px;cursor:pointer}
.card.ok{border-left-color:var(--ok)}.card.low{border-left-color:var(--low)}.card.out{border-left-color:var(--out)}
.card:hover{border-color:var(--text)}
.name{font-weight:600;font-size:1.05rem}.meta{color:var(--muted);font-size:.9rem}
.pill{font-size:.85rem;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.low{background:var(--lowbg);color:var(--low)}.pill.out{background:var(--outbg);color:var(--out)}
.fuels{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.note{margin-top:28px;font-size:.85rem;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 2px;font-size:1.5rem}
.close{float:right;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer}
.fuelbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.fuelbox .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fuelbox b{font-size:1.1rem}
.eta{margin:8px 0 0;color:var(--text)}
.upd{color:var(--muted);font-size:.85rem;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>Where is fuel today?</h1>
  <p class="sub">Check which stations have petrol or diesel before you drive. No account needed.</p>

  <section class="filters" aria-label="Filters">
    <div class="grid2">
      <label>Location<select id="city"></select></label>
      <label>Search by station or area<input id="q" type="search" placeholder="For example, Area 3"></label>
    </div>
    <div class="row" id="fuelRow"><span class="lbl">Fuel type</span></div>
    <div class="row" id="statusRow"><span class="lbl">Availability</span></div>
  </section>

  <p class="count" id="count" aria-live="polite"></p>
  <div class="list" id="list"></div>
  <p class="note">This preview uses sample data. Real station updates will appear here once they are connected.</p>
</div>

<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dtitle" id="sheet"></div></div>

<script>
const S=[
["Puma Area 3","Puma Energy","Lilongwe","Area 3","ok","ok",null,12],
["Total Capital City","TotalEnergies","Lilongwe","City Centre","out","ok",3,25],
["Petroda Kanengo","Petroda","Lilongwe","Kanengo","ok","ok",null,8],
["Engen Area 47","Engen","Lilongwe","Area 47","ok","out",5,40],
["Moil Old Town","Moil","Lilongwe","Old Town","out","out",20,55],
["Puma Limbe","Puma Energy","Blantyre","Limbe","ok","ok",null,6],
["Total Chichiri","TotalEnergies","Blantyre","Chichiri","out","ok",4,18],
["Petroda Ginnery Corner","Petroda","Blantyre","Ginnery Corner","out","out",2,33],
["Engen Mandala","Engen","Blantyre","Mandala","ok","out",6,15],
["Puma Mzuzu Town","Puma Energy","Mzuzu","Town Centre","out","out",8,22],
["Total Katoto","TotalEnergies","Mzuzu","Katoto","out","out",26,70],
["Petroda Luwinga","Petroda","Mzuzu","Luwinga","ok","ok",null,10],
["Puma Zomba Market","Puma Energy","Zomba","Market","ok","ok",null,14],
["Total Mulunguzi","TotalEnergies","Zomba","Mulunguzi","out","ok",7,45],
["Engen Zomba Road","Engen","Zomba","Zomba Road","ok","out",9,29]
].map((r,i)=>({id:i,name:r[0],brand:r[1],city:r[2],area:r[3],petrol:r[4],diesel:r[5],eta:r[6],mins:r[7]}));

const word={ok:"Has fuel",out:"No fuel"};
const rank={ok:0,low:1,out:2};
let f={city:"All locations",fuel:"Any",status:"All",q:""};

const $=id=>document.getElementById(id);
const cities=["All locations",...new Set(S.map(s=>s.city))];
$("city").innerHTML=cities.map(c=>`<option>${c}</option>`).join("");
$("city").onchange=e=>{f.city=e.target.value;render()};
$("q").oninput=e=>{f.q=e.target.value.toLowerCase().trim();render()};

function chips(rowId,opts,key){
  const row=$(rowId);
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=o;b.setAttribute("aria-pressed",o===f[key]);
    b.onclick=()=>{f[key]=o;[...row.querySelectorAll(".chip")].forEach(x=>x.setAttribute("aria-pressed",x.textContent===o));render()};
    row.appendChild(b);
  });
}
chips("fuelRow",["Any","Petrol","Diesel"],"fuel");
chips("statusRow",["All","Has fuel","No fuel"],"status");

function overall(s){
  if(f.fuel==="Petrol")return s.petrol;
  if(f.fuel==="Diesel")return s.diesel;
  return rank[s.petrol]<=rank[s.diesel]?s.petrol:s.diesel;
}
function render(){
  const list=S.filter(s=>{
    if(f.city!=="All locations"&&s.city!==f.city)return false;
    if(f.q&&!(s.name+" "+s.area+" "+s.brand).toLowerCase().includes(f.q))return false;
    const o=overall(s);
    if(f.status!=="All"&&word[o]!==f.status)return false;
    return true;
  }).sort((a,b)=>rank[overall(a)]-rank[overall(b)]||a.mins-b.mins);
  $("count").textContent=list.length+(list.length===1?" station found":" stations found");
  $("list").innerHTML=list.length?list.map(s=>{
    const o=overall(s);
    return `<button class="card ${o}" data-id="${s.id}">
      <div><div class="name">${s.name}</div><div class="meta">${s.area}, ${s.city}</div></div>
      <span class="pill ${o}">${word[o]}</span>
      <div class="fuels"><span class="pill ${s.petrol}">Petrol: ${word[s.petrol]}</span><span class="pill ${s.diesel}">Diesel: ${word[s.diesel]}</span></div>
    </button>`}).join(""):`<div class="empty"><b>No stations match</b><br>Try another location or clear a filter.</div>`;
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openSheet(+c.dataset.id));
}
function ago(m){return m<60?m+" minutes ago":Math.round(m/60)+" hours ago"}
function etaText(h){
  if(h==null)return "";
  const d=new Date(Date.now()+h*3600000);
  const t=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  const dt=d.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"});
  return "Estimated arrival of the next delivery: "+dt+", about "+t+".";
}
function box(label,st,eta){
  return `<div class="fuelbox"><div class="top"><b>${label}</b><span class="pill ${st}">${word[st]}</span></div>
  ${st==="ok"?`<p class="eta">Pumps are serving this fuel now.</p>`:`<p class="eta">${etaText(eta)}</p>`}</div>`;
}
function openSheet(id){
  const s=S[id];
  $("sheet").innerHTML=`<button class="close" id="x">Close</button>
    <h2 id="dtitle">${s.name}</h2><div class="meta">${s.brand} in ${s.area}, ${s.city}</div>
    ${box("Petrol",s.petrol,s.eta)}${box("Diesel",s.diesel,s.eta!=null?s.eta+1:null)}
    <p class="upd">Updated ${ago(s.mins)}. Deliveries can change, so call ahead if you are driving far.</p>`;
  $("ov").classList.add("open");$("x").focus();$("x").onclick=closeSheet;
}
function closeSheet(){$("ov").classList.remove("open")}
$("ov").onclick=e=>{if(e.target.id==="ov")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
render();
</script>
</body>
</html>
